<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكلوروفيل والأعماق - الجزائر</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;height:100%;font-family:sans-serif}
#map{height:100%}
.box{position:absolute;z-index:1000;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:10px;font-size:14px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#info{bottom:20px;left:10px;font-size:12px;max-width:calc(100vw - 280px)}
#legend{bottom:20px;right:10px}
#dlegend{bottom:20px;right:10px;display:none;font-size:12px}
#dtitle{text-align:center;margin-bottom:4px}
#dwrap{display:flex;direction:ltr;gap:6px;align-items:stretch}
#dcol{display:flex;flex-direction:column;width:22px}
#dlab{position:relative;width:46px}
#dlab span{position:absolute;left:0;transform:translateY(-50%);white-space:nowrap}
#bar{height:14px;width:200px;margin:6px 0 2px;border-radius:4px}
#nums{display:flex;justify-content:space-between;direction:ltr;font-size:12px}
#modes{top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px}
#dtools{top:76px;left:50%;transform:translateX(-50%);display:none;gap:6px;padding:6px}
.box button{border:0;border-radius:8px;padding:9px 14px;font-size:15px;background:#e5e7eb;color:#111}
.box button.on{background:#0b63d6;color:#fff}
#dtools button{font-size:13px;padding:7px 10px}
.leaflet-control-layers{direction:rtl;text-align:right}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;top:130px;left:10px;right:10px;z-index:99999;background:#fff;color:#c00;padding:10px;font-size:14px;direction:ltr;border:2px solid #c00">'+m+' | line '+l+'</div>');};</script>
<div id="map"></div>
<div id="modes" class="box">
<button id="bChl" class="on">🌊 الكلوروفيل</button>
<button id="bDepth">📏 الأعماق</button>
</div>
<div id="dtools" class="box">
<button id="bPal">🎨 الألوان</button>
<button id="bShade" class="on">⛰️ تضليل</button>
</div>
<div id="info" class="box">جاري التحميل...</div>
<div id="legend" class="box">
<div>الكلوروفيل (ملغ/م³)</div>
<div id="bar"></div>
<div id="nums"><span>0.05</span><span>0.5</span><span>5</span></div>
</div>
<div id="dlegend" class="box">
<div id="dtitle">العمق (متر)</div>
<div id="dwrap"><div id="dcol"></div><div id="dlab"></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js?v=12"></script>
</body>
</html>
