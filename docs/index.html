<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكلوروفيل - الجزائر</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;height:100%;font-family:sans-serif}
#map{height:100%}
.box{position:absolute;z-index:1000;background:#fff;padding:8px 12px;border-radius:8px;font-size:14px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#info{top:10px;right:10px}
#legend{bottom:20px;right:10px}
#bar{height:12px;width:200px;margin:6px 0 2px;background:linear-gradient(to right,hsl(240,100%,50%),hsl(180,100%,50%),hsl(120,100%,50%),hsl(60,100%,50%),hsl(0,100%,50%))}
#nums{display:flex;justify-content:space-between;direction:ltr;font-size:12px}
</style>
</head>
<body>
<div id="map"></div>
<div id="info" class="box">جاري التحميل...</div>
<div id="legend" class="box">
<div>الكلوروفيل (ملغ/م³)</div>
<div id="bar"></div>
<div id="nums"><span>0.05</span><span>0.3</span><span>1</span><span>5</span></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map').setView([36.6, 3.0], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 12, attribution: '© OpenStreetMap'}).addTo(map);

function color(v) {
  var t = (Math.log10(v) - Math.log10(0.05)) / (Math.log10(5) - Math.log10(0.05));
  t = Math.max(0, Math.min(1, t));
  return 'hsl(' + (240 - 240 * t) + ',100%,50%)';
}

fetch('chl_latest.json?' + Date.now())
  .then(function (r) { return r.json(); })
  .then(function (d) {
    var ny = d.lats.length, nx = d.lons.length;
    var latAsc = d.lats[0] < d.lats[ny - 1];
    var minLat = Math.min.apply(null, d.lats), maxLat = Math.max.apply(null, d.lats);
    var minLon = Math.min.apply(null, d.lons), maxLon = Math.max.apply(null, d.lons);

    var c = document.createElement('canvas');
    c.width = nx; c.height = ny;
    var ctx = c.getContext('2d');
    for (var i = 0; i < ny; i++) {
      var row = latAsc ? ny - 1 - i : i;
      for (var j = 0; j < nx; j++) {
        var v = d.values[i][j];
        if (v === null) continue;
        ctx.fillStyle = color(v);
        ctx.fillRect(j, row, 1, 1);
      }
    }
    var bounds = [[minLat, minLon], [maxLat, maxLon]];
    L.imageOverlay(c.toDataURL(), bounds, {opacity: 0.7}).addTo(map);
    map.fitBounds(bounds);
    document.getElementById('info').innerHTML = 'الكلوروفيل في سواحل الجزائر<br>تاريخ البيانات: ' + d.date;

    map.on('click', function (e) {
      var f = (e.latlng.lat - minLat) / (maxLat - minLat);
      var g = (e.latlng.lng - minLon) / (maxLon - minLon);
      var txt = 'خارج منطقة البيانات';
      if (f >= 0 && f <= 1 && g >= 0 && g <= 1) {
        var k = Math.round(f * (ny - 1));
        var i2 = latAsc ? k : ny - 1 - k;
        var j2 = Math.round(g * (nx - 1));
        var val = d.values[i2][j2];
        txt = (val === null) ? 'لا توجد بيانات هنا (يابسة أو غيوم)' : 'الكلوروفيل: ' + val + ' ملغ/م³';
      }
      L.popup().setLatLng(e.latlng).setContent(txt).openOn(map);
    });
  })
  .catch(function () {
    document.getElementById('info').textContent = 'تعذر تحميل البيانات';
  });
</script>
</body>
</html>
