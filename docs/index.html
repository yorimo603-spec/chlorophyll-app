<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكلوروفيل والأعماق - الجزائر</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;height:100%;font-family:sans-serif}
#map{height:100%}
.box{position:absolute;z-index:1000;background:rgba(255,255,255,.92);padding:6px 10px;border-radius:10px;font-size:13px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#legend{top:10px;left:58px;right:auto;bottom:auto;font-size:12px}
#info{top:10px;left:auto;right:70px;bottom:auto;font-size:11px;max-width:150px}
#bar{height:12px;width:140px;margin:4px 0 2px;border-radius:4px}
#nums{display:flex;justify-content:space-between;direction:ltr;font-size:11px}
#modes{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;width:calc(100vw - 16px);max-width:560px;box-sizing:border-box;justify-content:space-between}
#modes button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;min-width:0}
#modes button span{font-size:20px}
#modes button.soon{opacity:.45}
.box button{border:0;border-radius:8px;padding:9px 14px;font-size:15px;background:#e5e7eb;color:#111}
.box button.on{background:#0b63d6;color:#fff}
.leaflet-control-layers{direction:rtl;text-align:right}
body #fpanel.box{bottom:88px;background:none;box-shadow:none;padding:0;width:min(94vw,400px)}
body #fpanel .frow:first-child{display:none}
body #fbody{background:rgba(255,255,255,.95);padding:6px 8px;border-radius:10px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
</style>
</head>
<body>
<script>window.onerror=function(m,s,l){document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;top:130px;left:10px;right:10px;z-index:99999;background:#fff;color:#c00;padding:10px;font-size:14px;direction:ltr;border:2px solid #c00">'+m+' | line '+l+'</div>');};</script>
<div id="map"></div>

<div id="modes" class="box">
<button id="mChl" class="on"><span>🟢</span>الكلوروفيل</button>
<button id="mCur"><span>🌀</span>التيارات</button>
<button id="mWav"><span>🌊</span>الأمواج</button>
<button class="soon" onclick="alert('قريباً')"><span>🌡️</span>الحرارة</button>
<button class="soon" onclick="alert('قريباً')"><span>💨</span>الرياح</button>
</div>

<div id="info" class="box">جاري التحميل...</div>
<div id="legend" class="box">
<div>الكلوروفيل (ملغ/م³)</div>
<div id="bar"></div>
<div id="nums"><span>0.05</span><span>0.5</span><span>5</span></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="forecast.js?v=2"></script>
<script src="app.js?v=6"></script>
<script>
(function(){
var mc=document.getElementById('mCur'),mw=document.getElementById('mWav'),mh=document.getElementById('mChl');
function sync(){
var c=document.getElementById('fbCur'),w=document.getElementById('fbWav');
mc.className=(c&&c.className==='on')?'on':'';
mw.className=(w&&w.className==='on')?'on':'';
}
function pick(id){var b=document.getElementById(id);if(b&&!b.disabled){b.click();}setTimeout(sync,60);}
mc.onclick=function(){pick('fbCur')};
mw.onclick=function(){pick('fbWav')};
function syncChl(){mh.className=(window.chlLayer&&map.hasLayer(chlLayer))?'on':'';}
mh.onclick=function(){
if(!window.chlLayer)return;
if(map.hasLayer(chlLayer)){map.removeLayer(chlLayer);}else{chlLayer.addTo(map);}
syncChl();
};
setInterval(syncChl,700);
})();
</script>
</body>
</html>
