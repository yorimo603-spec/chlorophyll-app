<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكلوروفيل - الجزائر</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;height:100%;font-family:sans-serif}
#map{height:100%}
.box{position:absolute;z-index:1000;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:10px;font-size:14px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#info{bottom:20px;left:10px}
#legend{bottom:20px;right:10px}
#bar{height:12px;width:200px;margin:6px 0 2px;border-radius:6px}
#nums{display:flex;justify-content:space-between;direction:ltr;font-size:12px}
.leaflet-control-layers{direction:rtl;text-align:right}
</style>
</head>
<body>
<div id="map"></div>
<div id="info" class="box">جاري التحميل...</div>
<div id="legend" class="box">
<div>الكلوروفيل (ملغ/م³)</div>
<div id="bar"></div>
<div id="nums"><span>0.05</span><span>0.5</span><span>5</span></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map', {maxZoom: 12}).setView([36.6, 3.0], 6);

var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 12, attribution: 'Tiles © Esri'});
var ocean = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {maxZoom: 12, maxNativeZoom: 10, attribution: 'Tiles © Esri'});
sat.addTo(map);

map.createPane('depth');
map.getPane('depth').style.zIndex = 450;
map.getPane('depth').style.pointerEvents = 'none';

var contours = L.tileLayer.wms('https://ows.emodnet-bathymetry.eu/wms', {
  layers: 'emodnet:contours', format: 'image/png', transparent: true, pane: 'depth', attribution: 'Bathymetry © EMODnet'
});
var depthColors = L.tileLayer.wms('https://ows.emodnet-bathymetry.eu/wms', {
  layers: 'emodnet:mean_rainbowcolour', format: 'image/png', transparent: true, opacity: 0.6, pane: 'depth', attribution: 'Bathymetry © EMODnet'
});
contours.addTo(map);

map.createPane('labels');
map.getPane('labels').style.zIndex = 650;
map.getPane('labels').style.pointerEvents = 'none';
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {pane: 'labels', maxZoom: 12, maxNativeZoom: 10}).addTo(map);

L.control.layers(
  {'قمر صناعي': sat, 'خريطة البحر': ocean},
  {'خطوط العمق (متر)': contours, 'ألوان العمق': depthColors},
  {collapsed: false}
).addTo(map);

var stops = [
  [0, [38, 70, 200]],
  [0.25, [0, 190, 230]],
  [0.5, [40, 220, 120]],
  [0.75, [255, 225, 40]],
  [1, [255, 90, 30]]
];

function rgbAt(t) {
  t = Math.max(0, Math.min(1, t));
  for (var k = 1; k < stops.length; k++) {
    if (t <= stops[k][0]) {
      var a = stops[k - 1], b = stops[k];
      var u = (t - a[0]) / (b[0] - a[0]);
      return [
        Math.round(a[1][0] + (b[1][0] - a[1][0]) * u),
        Math.round(a[1][1] + (b[1][1] - a[1][1]) * u),
        Math.round(a[1][2] + (b[1][2] - a[1][2]) * u)
      ];
    }
  }
  return stops[stops.length - 1][1];
}

function getT(v) {
  var t = (Math.log10(v) - Math.log10(0.05)) / (Math.log10(5) - Math.log10(0.05));
  return Math.max(0, Math.min(1, t));
}

var parts = [];
for (var s = 0; s < stops.length; s++) {
  var cc = stops[s][1];
  parts.push('rgb(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ') ' + (stops[s][0] * 100) + '%');
}
document.getElementById('bar').style.background = 'linear-gradient(to right,' + parts.join(',') + ')';

function getDepth(latlng) {
  var url = 'https://rest.emodnet-bathymetry.eu/depth_sample?geom=POINT(' + latlng.lng + '%20' + latlng.lat + ')';
  return fetch(url)
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var v = null;
      if (typeof j === 'number') v = j;
      else if (j && typeof j.avg === 'number') v = j.avg;
      else if (j && typeof j.depth === 'number') v = j.depth;
      if (v === null) return '';
      if (v >= 0) return '';
      return '<br>العمق: ' + Math.abs(Math.round(v)) + ' متر';
    })
    .catch(function () { return ''; });
}

fetch('chl_latest.json?' + Date.now())
  .then(function (r) { return r.json(); })
  .then(function (d) {
    var ny = d.lats.length, nx = d.lons.length;
    var latAsc = d.lats[0] < d.lats[ny - 1];
    var minLat = Math.min.apply(null, d.lats), maxLat = Math.max.apply(null, d.lats);
    var minLon = Math.min.apply(null, d.lons), maxLon = Math.max.apply(null, d.lons);

    var small = document.createElement('canvas');
    small.width = nx; small.height = ny;
    var sctx = small.getContext('2d');
    var img = sctx.createImageData(nx, ny);
    for (var i = 0; i < ny; i++) {
      var row = latAsc ? ny - 1 - i : i;
      for (var j = 0; j < nx; j++) {
        var v = d.values[i][j];
        if (v === null) continue;
        var t = getT(v);
        var c = rgbAt(t);
        var p = (row * nx + j) * 4;
        img.data[p] = c[0];
        img.data[p + 1] = c[1];
        img.data[p + 2] = c[2];
        img.data[p + 3] = Math.round(255 * (0.45 + 0.5 * t));
      }
    }
    sctx.putImageData(img, 0, 0);

    var big = document.createElement('canvas');
    big.width = nx * 4; big.height = ny * 4;
    var bctx = big.getContext('2d');
    bctx.imageSmoothingEnabled = true;
    bctx.imageSmoothingQuality = 'high';
    bctx.drawImage(small, 0, 0, big.width, big.height);

    var bounds = [[minLat, minLon], [maxLat, maxLon]];
    L.imageOverlay(big.toDataURL(), bounds, {opacity: 1}).addTo(map);
    map.fitBounds(bounds);
    document.getElementById('info').innerHTML = 'الكلوروفيل في سواحل الجزائر<br>تاريخ البيانات: ' + d.date;

    map.on('click', function (e) {
      var f = (e.latlng.lat - minLat) / (maxLat - minLat);
      var g = (e.latlng.lng - minLon) / (maxLon - minLon);
      var txt = 'خارج منطقة البيانات';
      if (f >= 0 && f <= 1 && g >= 0 && g <= 1) {
        var k = Math.round(f * (ny - 1));
        var i2 = latAsc ? k : ny - 1 - k;
        var j2 = Math.round(g * (nx - 1));
        var val = d.values[i2][j2];
        txt = (val === null) ? 'لا توجد بيانات هنا (يابسة أو غيوم)' : 'الكلوروفيل: ' + val + ' ملغ/م³';
      }
      var popup = L.popup().setLatLng(e.latlng).setContent(txt).openOn(map);
      getDepth(e.latlng).then(function (extra) {
        if (extra) popup.setContent(txt + extra);
      });
    });
  })
  .catch(function () {
    document.getElementById('info').textContent = 'تعذر تحميل البيانات';
  });
</script>
</body>
</html>
