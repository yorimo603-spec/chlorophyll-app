<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الكلوروفيل والأعماق - الجزائر</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;height:100%;font-family:sans-serif}
#map{height:100%}
.box{position:absolute;z-index:1000;background:rgba(255,255,255,.92);padding:8px 12px;border-radius:10px;font-size:14px;box-shadow:0 1px 5px rgba(0,0,0,.4)}
#info{bottom:20px;left:10px;font-size:12px;max-width:calc(100vw - 280px)}
#legend{bottom:20px;right:10px}
#dlegend{bottom:20px;right:10px;display:none;font-size:12px}
#dtitle{text-align:center;margin-bottom:4px}
#dwrap{display:flex;direction:ltr;gap:6px;align-items:stretch}
#dcol{display:flex;flex-direction:column;width:22px}
#dlab{position:relative;width:46px}
#dlab span{position:absolute;left:0;transform:translateY(-50%);white-space:nowrap}
#bar{height:14px;width:200px;margin:6px 0 2px;border-radius:4px}
#nums{display:flex;justify-content:space-between;direction:ltr;font-size:12px}
#modes{top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:6px}
#dtools{top:76px;left:50%;transform:translateX(-50%);display:none;gap:6px;padding:6px}
.box button{border:0;border-radius:8px;padding:9px 14px;font-size:15px;background:#e5e7eb;color:#111}
.box button.on{background:#0b63d6;color:#fff}
#dtools button{font-size:13px;padding:7px 10px}
.leaflet-control-layers{direction:rtl;text-align:right}
</style>
</head>
<body>
<div id="map"></div>
<div id="modes" class="box">
<button id="bChl" class="on">🌊 الكلوروفيل</button>
<button id="bDepth">📏 الأعماق</button>
</div>
<div id="dtools" class="box">
<button id="bPal">🎨 الألوان</button>
<button id="bShade" class="on">⛰️ تضليل</button>
</div>
<div id="info" class="box">جاري التحميل...</div>
<div id="legend" class="box">
<div>الكلوروفيل (ملغ/م³)</div>
<div id="bar"></div>
<div id="nums"><span>0.05</span><span>0.5</span><span>5</span></div>
</div>
<div id="dlegend" class="box">
<div id="dtitle">العمق (متر)</div>
<div id="dwrap"><div id="dcol"></div><div id="dlab"></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var map = L.map('map', {maxZoom: 19, minZoom: 5}).setView([36.6, 3.0], 6);

var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19, maxNativeZoom: 17, attribution: 'Tiles © Esri'});
var ocean = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19, maxNativeZoom: 10, attribution: 'Tiles © Esri'});
sat.addTo(map);
L.control.layers({'قمر صناعي': sat, 'خريطة البحر': ocean}, null, {collapsed: true}).addTo(map);

map.createPane('depthcol');
map.getPane('depthcol').style.zIndex = 420;
map.getPane('depthcol').style.pointerEvents = 'none';

map.createPane('depth');
map.getPane('depth').style.zIndex = 450;
map.getPane('depth').style.pointerEvents = 'none';
var contours = L.tileLayer.wms('https://ows.emodnet-bathymetry.eu/wms', {
  layers: 'emodnet:contours', format: 'image/png', transparent: true, pane: 'depth', maxZoom: 19, attribution: 'Bathymetry © EMODnet'
});
contours.addTo(map);

map.createPane('labels');
map.getPane('labels').style.zIndex = 650;
map.getPane('labels').style.pointerEvents = 'none';
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {pane: 'labels', maxZoom: 19, maxNativeZoom: 17}).addTo(map);

/* ========== الأعماق: قراءة الأرقام والتلوين داخل المتصفح ========== */
var TERR = 'https://elevation-tiles-prod.s3.amazonaws.com/terrarium/';
var elCache = {};

function getElev(z, x, y, cb) {
  var n = Math.pow(2, z);
  if (y < 0 || y >= n) { cb(null); return; }
  x = ((x % n) + n) % n;
  var key = z + '/' + x + '/' + y;
  if (elCache[key]) { cb(elCache[key]); return; }
  var img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = function () {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    var cx = c.getContext('2d');
    cx.drawImage(img, 0, 0);
    var d = cx.getImageData(0, 0, 256, 256).data;
    var el = new Float32Array(65536);
    for (var i = 0; i < 65536; i++) {
      el[i] = d[i * 4] * 256 + d[i * 4 + 1] + d[i * 4 + 2] / 256 - 32768;
    }
    elCache[key] = el;
    cb(el);
  };
  img.onerror = function () { cb(null); };
  img.src = TERR + z + '/' + x + '/' + y + '.png';
}

function hex2rgb(h) {
  return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
}
function lerpPal(stops, t) {
  var n = stops.length - 1;
  var x = Math.max(0, Math.min(1, t)) * n;
  var i = Math.min(n - 1, Math.floor(x));
  var u = x - i;
  var a = hex2rgb(stops[i]), b = hex2rgb(stops[i + 1]);
  return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u];
}

var PALETTES = [
  {name: 'طيف', stops: ['#d7191c', '#f46d43', '#fdae61', '#fee08b', '#e6f598', '#abdda4', '#66c2a5', '#3288bd', '#5e4fa2'], tail: ['#4a2f80', '#33225f', '#1f1640', '#0e0a24']},
  {name: 'Viridis', stops: ['#fde725', '#5ec962', '#21918c', '#3b528b', '#440154'], tail: ['#2c0b45', '#1f0933', '#150624', '#0b0314']},
  {name: 'أزرق', stops: ['#e6f5ff', '#a6d8f5', '#5aa9e0', '#2a6fba', '#123f86'], tail: ['#0c2f6b', '#082254', '#05173d', '#030d26']}
];
var palIdx = 0;
var curCols = [];
var shadeOn = true;

function buildCols() {
  var p = PALETTES[palIdx];
  curCols = [];
  for (var i = 0; i < 20; i++) curCols.push(lerpPal(p.stops, i / 19));
  for (var j = 0; j < 4; j++) curCols.push(hex2rgb(p.tail[j]));
}

function buildLegend() {
  var col = document.getElementById('dcol');
  col.innerHTML = '';
  for (var i = 0; i < 24; i++) {
    var d = document.createElement('div');
    d.style.height = (i < 20 ? 9 : 16) + 'px';
    d.style.background = 'rgb(' + Math.round(curCols[i][0]) + ',' + Math.round(curCols[i][1]) + ',' + Math.round(curCols[i][2]) + ')';
    col.appendChild(d);
  }
  var lab = document.getElementById('dlab');
  lab.innerHTML = '';
  lab.style.height = (20 * 9 + 4 * 16) + 'px';
  var marks = [[0, '0'], [45, '50'], [90, '100'], [135, '150'], [180, '200'], [196, '500'], [212, '1000'], [236, '2000+']];
  for (var m = 0; m < marks.length; m++) {
    var s = document.createElement('span');
    s.textContent = marks[m][1];
    s.style.top = marks[m][0] + 'px';
    lab.appendChild(s);
  }
}

function binOf(e) {
  if (e >= 0) return -1;
  var d = -e;
  if (d < 200) return Math.floor(d / 10);
  if (d < 500) return 20;
  if (d < 1000) return 21;
  if (d < 2000) return 22;
  return 23;
}
function lineStrength(a, b) {
  var m = Math.max(a, b);
  var depth = m <= 20 ? m * 10 : (m === 21 ? 500 : (m === 22 ? 1000 : 2000));
  return (depth % 50 === 0) ? 2 : 1;
}

function renderTile(el, z, ty, canvas) {
  var ctx = canvas.getContext('2d');
  var out = ctx.createImageData(256, 256);
  var o = out.data;
  var idx = new Int8Array(65536);
  for (var i = 0; i < 65536; i++) idx[i] = binOf(el[i]);

  var n = Math.pow(2, z);
  var lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * (ty + 0.5) / n)));
  var cell = 40075016.68 * Math.cos(lat) / (256 * n);
  var k = shadeOn ? 8 / (2 * cell) : 0;

  for (var y = 0; y < 256; y++) {
    for (var x = 0; x < 256; x++) {
      var p = y * 256 + x;
      var b = idx[p];
      if (b < 0) continue;
      var c = curCols[b];
      var f = 1;
      if (shadeOn) {
        var xl = x > 0 ? x - 1 : x, xr = x < 255 ? x + 1 : x;
        var yu = y > 0 ? y - 1 : y, yd = y < 255 ? y + 1 : y;
        var dzdx = (Math.min(el[y * 256 + xr], 0) - Math.min(el[y * 256 + xl], 0)) * k;
        var dzdy = (Math.min(el[yu * 256 + x], 0) - Math.min(el[yd * 256 + x], 0)) * k;
        var inv = 1 / Math.sqrt(dzdx * dzdx + dzdy * dzdy + 1);
        f = (0.5 * dzdx - 0.5 * dzdy + 0.707) * inv / 0.707;
        f = Math.max(0.45, Math.min(1.55, f));
      }
      var line = 0;
      if (x < 255) {
        var r = idx[p + 1];
        if (r >= 0 && r !== b) line = lineStrength(b, r);
      }
      if (y < 255) {
        var dn = idx[p + 256];
        if (dn >= 0 && dn !== b) {
          var l2 = lineStrength(b, dn);
          if (l2 > line) line = l2;
        }
      }
      if (line === 2) f *= 0.35;
      else if (line === 1) f *= 0.82;
      var q = p * 4;
      o[q] = Math.max(0, Math.min(255, c[0] * f));
      o[q + 1] = Math.max(0, Math.min(255, c[1] * f));
      o[q + 2] = Math.max(0, Math.min(255, c[2] * f));
      o[q + 3] = 235;
    }
  }
  ctx.putImageData(out, 0, 0);
}

var DepthLayer = L.GridLayer.extend({
  createTile: function (coords, done) {
    var tile = document.createElement('canvas');
    tile.width = 256; tile.height = 256;
    getElev(coords.z, coords.x, coords.y, function (el) {
      if (el) renderTile(el, coords.z, coords.y, tile);
      done(null, tile);
    });
    return tile;
  }
});
var depthLayer = new DepthLayer({pane: 'depthcol', maxNativeZoom: 12, maxZoom: 19, minZoom: 5, attribution: 'Terrain © Mapzen / GEBCO'});

function sampleDepth(latlng) {
  return new Promise(function (resolve) {
    var z = 10, n = Math.pow(2, z);
    var latr = latlng.lat * Math.PI / 180;
    var xf = (latlng.lng + 180) / 360 * n;
    var yf = (1 - Math.log(Math.tan(latr) + 1 / Math.cos(latr)) / Math.PI) / 2 * n;
    var tx = Math.floor(xf), ty = Math.floor(yf);
    getElev(z, tx, ty, function (el) {
      if (!el) { resolve(''); return; }
      var px = Math.min(255, Math.floor((xf - tx) * 256));
      var py = Math.min(255, Math.floor((yf - ty) * 256));
      var e = el[py * 256 + px];
      if (e >= 0) { resolve('يابسة'); return; }
      resolve('العمق: ' + Math.abs(Math.round(-e)) + ' متر تقريباً');
    });
  });
}

/* ========== الكلوروفيل ========== */
var palette = [
  [30, 40, 160], [20, 110, 240], [0, 200, 255], [0, 230, 150], [120, 235, 60],
  [255, 240, 0], [255, 160, 0], [255, 60, 0], [190, 0, 60]
];
var N = palette.length;
var LMIN = Math.log10(0.05), LMAX = Math.log10(5);

var parts = [];
for (var s = 0; s < N; s++) {
  var cc = palette[s];
  var colr = 'rgb(' + cc[0] + ',' + cc[1] + ',' + cc[2] + ')';
  parts.push(colr + ' ' + (s / N * 100) + '%');
  parts.push(colr + ' ' + ((s + 1) / N * 100) + '%');
}
document.getElementById('bar').style.background = 'linear-gradient(to right,' + parts.join(',') + ')';

var mode = 'chl';
var chlLayer = null;
var data = null;
var bnd = null;
var chlInfo = 'جاري التحميل...';

function setMode(m) {
  mode = m;
  var isChl = (m === 'chl');
  if (isChl) {
    if (map.hasLayer(depthLayer)) map.removeLayer(depthLayer);
    if (!map.hasLayer(contours)) contours.addTo(map);
    if (chlLayer && !map.hasLayer(chlLayer)) chlLayer.addTo(map);
  } else {
    if (chlLayer && map.hasLayer(chlLayer)) map.removeLayer(chlLayer);
    if (map.hasLayer(contours)) map.removeLayer(contours);
    if (!map.hasLayer(depthLayer)) depthLayer.addTo(map);
  }
  document.getElementById('legend').style.display = isChl ? 'block' : 'none';
  document.getElementById('dlegend').style.display = isChl ? 'none' : 'block';
  document.getElementById('dtools').style.display = isChl ? 'none' : 'flex';
  document.getElementById('info').innerHTML = isChl ? chlInfo : 'خريطة الأعماق: لون لكل 10 متر';
  document.getElementById('bChl').className = isChl ? 'on' : '';
  document.getElementById('bDepth').className = isChl ? '' : 'on';
}
document.getElementById('bChl').onclick = function () { setMode('chl'); };
document.getElementById('bDepth').onclick = function () { setMode('depth'); };

document.getElementById('bPal').onclick = function () {
  palIdx = (palIdx + 1) % PALETTES.length;
  buildCols();
  buildLegend();
  depthLayer.redraw();
  document.getElementById('bPal').textContent = '🎨 ' + PALETTES[palIdx].name;
};
document.getElementById('bShade').onclick = function () {
  shadeOn = !shadeOn;
  document.getElementById('bShade').className = shadeOn ? 'on' : '';
  depthLayer.redraw();
};

buildCols();
buildLegend();
document.getElementById('bPal').textContent = '🎨 ' + PALETTES[palIdx].name;

map.on('click', function (e) {
  var chlTxt = '';
  if (mode === 'chl' && data && bnd) {
    var d = data;
    var ny = d.lats.length, nx = d.lons.length;
    var latAsc = d.lats[0] < d.lats[ny - 1];
    var f = (e.latlng.lat - bnd.minLat) / (bnd.maxLat - bnd.minLat);
    var g2 = (e.latlng.lng - bnd.minLon) / (bnd.maxLon - bnd.minLon);
    chlTxt = 'خارج منطقة بيانات الكلوروفيل';
    if (f >= 0 && f <= 1 && g2 >= 0 && g2 <= 1) {
      var k = Math.round(f * (ny - 1));
      var i2 = latAsc ? k : ny - 1 - k;
      var j2 = Math.round(g2 * (nx - 1));
      var val = d.values[i2][j2];
      chlTxt = (val === null) ? 'لا توجد بيانات كلوروفيل هنا (يابسة أو غيوم)' : 'الكلوروفيل: ' + val + ' ملغ/م³';
    }
  }
  var popup = L.popup().setLatLng(e.latlng).setContent(chlTxt || 'جاري قياس العمق...').openOn(map);
  sampleDepth(e.latlng).then(function (dtxt) {
    var all = chlTxt;
    if (dtxt) all = all ? all + '<br>' + dtxt : dtxt;
    if (!all) all = 'العمق غير متوفر هنا';
    popup.setContent(all);
  });
});

fetch('chl_latest.json?' + Date.now())
  .then(function (r) { return r.json(); })
  .then(function (d) {
    data = d;
    var ny = d.lats.length, nx = d.lons.length;
    var latAsc = d.lats[0] < d.lats[ny - 1];
    var minLat = Math.min.apply(null, d.lats), maxLat = Math.max.apply(null, d.lats);
    var minLon = Math.min.apply(null, d.lons), maxLon = Math.max.apply(null, d.lons);
    bnd = {minLat: minLat, maxLat: maxLat, minLon: minLon, maxLon: maxLon};

    var grid = new Float32Array(nx * ny);
    for (var r = 0; r < ny; r++) {
      var di = latAsc ? ny - 1 - r : r;
      for (var c = 0; c < nx; c++) {
        var v = d.values[di][c];
        grid[r * nx + c] = (v === null || v === undefined || v <= 0) ? NaN : Math.log10(v);
      }
    }

    var scale = Math.max(1, Math.min(4, Math.floor(2400 / nx)));
    var W = nx * scale, H = ny * scale;
    var big = document.createElement('canvas');
    big.width = W; big.height = H;
    var bctx = big.getContext('2d');
    var img = bctx.createImageData(W, H);

    for (var y = 0; y < H; y++) {
      var fy = (y + 0.5) / scale - 0.5;
      var y0 = Math.floor(fy), ty = fy - y0;
      for (var x = 0; x < W; x++) {
        var fx = (x + 0.5) / scale - 0.5;
        var x0 = Math.floor(fx), tx = fx - x0;
        var sum = 0, wsum = 0;
        for (var dy = 0; dy < 2; dy++) {
          var yy = y0 + dy;
          if (yy < 0 || yy >= ny) continue;
          for (var dx = 0; dx < 2; dx++) {
            var xx = x0 + dx;
            if (xx < 0 || xx >= nx) continue;
            var g = grid[yy * nx + xx];
            if (g !== g) continue;
            var w = (dx ? tx : 1 - tx) * (dy ? ty : 1 - ty);
            sum += g * w; wsum += w;
          }
        }
        if (wsum < 0.5) continue;
        var t = (sum / wsum - LMIN) / (LMAX - LMIN);
        t = Math.max(0, Math.min(0.9999, t));
        var col2 = palette[Math.floor(t * N)];
        var p = (y * W + x) * 4;
        img.data[p] = col2[0];
        img.data[p + 1] = col2[1];
        img.data[p + 2] = col2[2];
        img.data[p + 3] = 225;
      }
    }
    bctx.putImageData(img, 0, 0);

    var bounds = [[minLat, minLon], [maxLat, maxLon]];
    chlLayer = L.imageOverlay(big.toDataURL(), bounds, {opacity: 1});
    chlInfo = 'الكلوروفيل في سواحل الجزائر<br>تاريخ البيانات: ' + d.date;
    map.fitBounds(bounds);
    setMode(mode);
  })
  .catch(function () {
    chlInfo = 'تعذر تحميل بيانات الكلوروفيل';
    document.getElementById('info').textContent = chlInfo;
  });
</script>
</body>
</html>
